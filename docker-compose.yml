version: '3.8'

services:
  # PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: archistore_db
    restart: always
    environment:
      POSTGRES_USER: archistore_user
      POSTGRES_PASSWORD: archistore_secure_password_2026
      POSTGRES_DB: archistore_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: archistore_redis
    restart: always
    ports:
      - "6379:6379"

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archistore_app
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://archistore_user:archistore_secure_password_2026@postgres:5432/archistore_db?schema=public"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PRIVATE_STORAGE_PATH: ./private_storage
    ports:
      - "3000:3000"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: archistore_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
